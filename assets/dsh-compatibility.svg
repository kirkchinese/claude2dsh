<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 320" width="1040" height="320" role="img" aria-label="Claude2DSH 0.3.0 compatibility across published DeepSeek Harness releases">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .ttl { fill: #e8eefc; font: 600 17px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .sub { fill: #8ea3c6; font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .hdr { fill: #7f8fb3; font: 700 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .09em; text-transform: uppercase; }
      .ver { fill: #f6f8fc; font: 600 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .note { fill: #93a7c9; font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .cellbg { fill: #111c30; stroke: #1f3050; stroke-width: 1; rx: 8; }
      .ok { fill: #0e3a2e; stroke: #2fbf8f; stroke-width: 1; rx: 6; }
      .okt { fill: #6ee7b7; font: 600 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .no { fill: #3a1420; stroke: #b4485f; stroke-width: 1; rx: 6; }
      .not { fill: #f4a3b4; font: 600 11.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .code { fill: #cbd6ea; font: 400 11.5px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1040" height="320"/>

  <text class="ttl" x="34" y="42">Supported harness releases</text>
  <text class="sub" x="34" y="64">Declared peer range <tspan class="code">&gt;=0.1.5-rc.1 &lt;0.2.0</tspan>. Both channels are verified by the same real-profile acceptance run in CI.</text>

  <text class="hdr" x="46" y="100">DSH release</text>
  <text class="hdr" x="300" y="100">Session format</text>
  <text class="hdr" x="470" y="100">Status</text>
  <text class="hdr" x="620" y="100">Evidence</text>

  <!-- rows -->
  <g>
    <rect class="cellbg" x="34" y="112" width="972" height="42"/>
    <text class="ver" x="46" y="139">0.1.6-alpha.1</text>
    <text class="note" x="300" y="139">v3</text>
    <rect class="ok" x="470" y="124" width="118" height="20"/><text class="okt" x="480" y="138">VERIFIED</text>
    <text class="code" x="620" y="139">npm run acceptance · alpha channel</text>
  </g>
  <g>
    <rect class="cellbg" x="34" y="162" width="972" height="42"/>
    <text class="ver" x="46" y="189">0.1.5-rc.1</text>
    <text class="note" x="300" y="189">v3</text>
    <rect class="ok" x="470" y="174" width="118" height="20"/><text class="okt" x="480" y="188">VERIFIED</text>
    <text class="code" x="620" y="189">npm run acceptance · latest channel</text>
  </g>
  <g>
    <rect class="cellbg" x="34" y="212" width="972" height="42"/>
    <text class="ver" x="46" y="239">0.1.5-alpha/rc · master</text>
    <text class="note" x="300" y="239">v3</text>
    <rect class="ok" x="470" y="224" width="118" height="20"/><text class="okt" x="480" y="238">IN RANGE</text>
    <text class="code" x="620" y="239">source-level compat typecheck</text>
  </g>
  <g>
    <rect class="cellbg" x="34" y="262" width="972" height="42"/>
    <text class="ver" x="46" y="289">0.1.0-rc.x · 0.1.3-alpha.2</text>
    <text class="note" x="300" y="289">v0</text>
    <rect class="no" x="470" y="274" width="118" height="20"/><text class="not" x="480" y="288">NOT SUPPORTED</text>
    <text class="code" x="620" y="289">service-level persistence removed upstream</text>
  </g>
</svg>
